# Фронтенды Loal: лендинг и четыре кабинета за тем же Traefik, что и бэкенд.
#
# Traefik живёт в соседнем проекте (cashup_platform/infra) и находит контейнеры
# через docker.sock по меткам. Поэтому здесь сеть — внешняя: имя той, к которой
# подключён сам Traefik (по умолчанию infra_default, см. TRAEFIK_NETWORK в .env).
#
# Разворачивается отдельно от бэкенда: его деплой стирает свою папку целиком,
# и фронтенд не должен в ней лежать.
name: loal-front

# Healthcheck здесь сознательно не задаём: Traefik исключает контейнер из
# маршрутизации, пока проверка не прошла, и падение проверки означало бы 404
# вместо страницы. За перезапуск отвечает restart: unless-stopped.
x-app: &app
  restart: unless-stopped
  networks: [web]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  landing:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile.landing
    image: loal-landing:latest
    environment:
      NEXT_PUBLIC_SITE_URL: https://${LANDING_HOST:-loal.kg}
      # Used by the deployment readiness check from the same Docker network.
      GATEWAY_RATE_LIMIT_URL: ${GATEWAY_RATE_LIMIT_URL:-http://gateway:8080/_edge/rate-limit}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-infra_default}
      - traefik.http.routers.loal-landing.rule=Host(`${LANDING_HOST:-loal.kg}`) || Host(`www.${LANDING_HOST:-loal.kg}`)
      - traefik.http.routers.loal-landing.entrypoints=websecure
      - traefik.http.routers.loal-landing.tls=true
      - traefik.http.routers.loal-landing.tls.certresolver=letsencrypt
      - traefik.http.routers.loal-landing.middlewares=loal-security-landing@docker,loal-ip-landing@docker,loal-www-to-apex@docker
      - traefik.http.services.loal-landing.loadbalancer.server.port=3000
      # Shared gateway/Redis quota; runs before pages, assets and redirects.
      - traefik.http.middlewares.loal-ip-landing.forwardauth.address=${GATEWAY_RATE_LIMIT_URL:-http://gateway:8080/_edge/rate-limit}
      - traefik.http.middlewares.loal-ip-landing.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.loal-ip-landing.forwardauth.authRequestHeaders=Origin
      - traefik.http.middlewares.loal-ip-landing.forwardauth.forwardBody=false
      - traefik.http.middlewares.loal-ip-landing.forwardauth.maxResponseBodySize=16384
      - traefik.http.middlewares.loal-ip-landing.forwardauth.preserveRequestMethod=false
      # www отдаём редиректом на основной домен: одна версия страницы для поиска
      - traefik.http.middlewares.loal-www-to-apex.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.loal-www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.loal-www-to-apex.redirectregex.permanent=true
      - traefik.http.middlewares.loal-security-landing.headers.stsSeconds=31536000
      - traefik.http.middlewares.loal-security-landing.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loal-security-landing.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loal-security-landing.headers.referrerPolicy=strict-origin-when-cross-origin

  admin:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile.spa
      args:
        APP: admin
        VITE_API_URL: ${API_URL:-https://loal.promconsult.pro}
        VITE_SITE_URL: https://${LANDING_HOST:-loal.kg}
        VITE_CLIENT_APP_URL: https://${CLIENT_HOST:-client.loal.kg}
    image: loal-admin:latest
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-infra_default}
      - traefik.http.routers.loal-admin.rule=Host(`${ADMIN_HOST:-admin.loal.kg}`)
      - traefik.http.routers.loal-admin.entrypoints=websecure
      - traefik.http.routers.loal-admin.tls=true
      - traefik.http.routers.loal-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.loal-admin.middlewares=loal-security-admin@docker,loal-ip-admin@docker
      - traefik.http.services.loal-admin.loadbalancer.server.port=80
      # Shared gateway/Redis quota; runs before pages, assets and redirects.
      - traefik.http.middlewares.loal-ip-admin.forwardauth.address=${GATEWAY_RATE_LIMIT_URL:-http://gateway:8080/_edge/rate-limit}
      - traefik.http.middlewares.loal-ip-admin.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.loal-ip-admin.forwardauth.authRequestHeaders=Origin
      - traefik.http.middlewares.loal-ip-admin.forwardauth.forwardBody=false
      - traefik.http.middlewares.loal-ip-admin.forwardauth.maxResponseBodySize=16384
      - traefik.http.middlewares.loal-ip-admin.forwardauth.preserveRequestMethod=false
      # Свой middleware у каждого приложения: общий жил бы на одном контейнере,
      # и пока тот не поднялся, Traefik ломал бы роутеры остальных
      - traefik.http.middlewares.loal-security-admin.headers.stsSeconds=31536000
      - traefik.http.middlewares.loal-security-admin.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loal-security-admin.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loal-security-admin.headers.referrerPolicy=strict-origin-when-cross-origin

  partner:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile.spa
      args:
        APP: partner
        VITE_API_URL: ${API_URL:-https://loal.promconsult.pro}
        VITE_SITE_URL: https://${LANDING_HOST:-loal.kg}
        VITE_CASHIER_APP_URL: https://${CASHIER_HOST:-cashier.loal.kg}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-753939199773-34gbat3ifsb35teep7ltu4dbnltm1t4b.apps.googleusercontent.com}
    image: loal-partner:latest
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-infra_default}
      - traefik.http.routers.loal-partner.rule=Host(`${PARTNER_HOST:-partner.loal.kg}`)
      - traefik.http.routers.loal-partner.entrypoints=websecure
      - traefik.http.routers.loal-partner.tls=true
      - traefik.http.routers.loal-partner.tls.certresolver=letsencrypt
      - traefik.http.routers.loal-partner.middlewares=loal-security-partner@docker,loal-ip-partner@docker
      - traefik.http.services.loal-partner.loadbalancer.server.port=80
      # Shared gateway/Redis quota; runs before pages, assets and redirects.
      - traefik.http.middlewares.loal-ip-partner.forwardauth.address=${GATEWAY_RATE_LIMIT_URL:-http://gateway:8080/_edge/rate-limit}
      - traefik.http.middlewares.loal-ip-partner.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.loal-ip-partner.forwardauth.authRequestHeaders=Origin
      - traefik.http.middlewares.loal-ip-partner.forwardauth.forwardBody=false
      - traefik.http.middlewares.loal-ip-partner.forwardauth.maxResponseBodySize=16384
      - traefik.http.middlewares.loal-ip-partner.forwardauth.preserveRequestMethod=false
      # Свой middleware у каждого приложения: общий жил бы на одном контейнере,
      # и пока тот не поднялся, Traefik ломал бы роутеры остальных
      - traefik.http.middlewares.loal-security-partner.headers.stsSeconds=31536000
      - traefik.http.middlewares.loal-security-partner.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loal-security-partner.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loal-security-partner.headers.referrerPolicy=strict-origin-when-cross-origin

  client:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile.spa
      args:
        APP: client
        VITE_API_URL: ${API_URL:-https://loal.promconsult.pro}
        VITE_SITE_URL: https://${LANDING_HOST:-loal.kg}
    image: loal-client:latest
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-infra_default}
      - traefik.http.routers.loal-client.rule=Host(`${CLIENT_HOST:-client.loal.kg}`)
      - traefik.http.routers.loal-client.entrypoints=websecure
      - traefik.http.routers.loal-client.tls=true
      - traefik.http.routers.loal-client.tls.certresolver=letsencrypt
      - traefik.http.routers.loal-client.middlewares=loal-security-client@docker,loal-ip-client@docker
      - traefik.http.services.loal-client.loadbalancer.server.port=80
      # Shared gateway/Redis quota; runs before pages, assets and redirects.
      - traefik.http.middlewares.loal-ip-client.forwardauth.address=${GATEWAY_RATE_LIMIT_URL:-http://gateway:8080/_edge/rate-limit}
      - traefik.http.middlewares.loal-ip-client.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.loal-ip-client.forwardauth.authRequestHeaders=Origin
      - traefik.http.middlewares.loal-ip-client.forwardauth.forwardBody=false
      - traefik.http.middlewares.loal-ip-client.forwardauth.maxResponseBodySize=16384
      - traefik.http.middlewares.loal-ip-client.forwardauth.preserveRequestMethod=false
      # Свой middleware у каждого приложения: общий жил бы на одном контейнере,
      # и пока тот не поднялся, Traefik ломал бы роутеры остальных
      - traefik.http.middlewares.loal-security-client.headers.stsSeconds=31536000
      - traefik.http.middlewares.loal-security-client.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loal-security-client.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loal-security-client.headers.referrerPolicy=strict-origin-when-cross-origin

  cashier:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile.spa
      args:
        APP: cashier
        VITE_API_URL: ${API_URL:-https://loal.promconsult.pro}
        VITE_SITE_URL: https://${LANDING_HOST:-loal.kg}
        VITE_PARTNER_APP_URL: https://${PARTNER_HOST:-partner.loal.kg}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-753939199773-34gbat3ifsb35teep7ltu4dbnltm1t4b.apps.googleusercontent.com}
    image: loal-cashier:latest
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-infra_default}
      - traefik.http.routers.loal-cashier.rule=Host(`${CASHIER_HOST:-cashier.loal.kg}`)
      - traefik.http.routers.loal-cashier.entrypoints=websecure
      - traefik.http.routers.loal-cashier.tls=true
      - traefik.http.routers.loal-cashier.tls.certresolver=letsencrypt
      - traefik.http.routers.loal-cashier.middlewares=loal-security-cashier@docker,loal-ip-cashier@docker
      - traefik.http.services.loal-cashier.loadbalancer.server.port=80
      # Shared gateway/Redis quota; runs before pages, assets and redirects.
      - traefik.http.middlewares.loal-ip-cashier.forwardauth.address=${GATEWAY_RATE_LIMIT_URL:-http://gateway:8080/_edge/rate-limit}
      - traefik.http.middlewares.loal-ip-cashier.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.loal-ip-cashier.forwardauth.authRequestHeaders=Origin
      - traefik.http.middlewares.loal-ip-cashier.forwardauth.forwardBody=false
      - traefik.http.middlewares.loal-ip-cashier.forwardauth.maxResponseBodySize=16384
      - traefik.http.middlewares.loal-ip-cashier.forwardauth.preserveRequestMethod=false
      # Свой middleware у каждого приложения: общий жил бы на одном контейнере,
      # и пока тот не поднялся, Traefik ломал бы роутеры остальных
      - traefik.http.middlewares.loal-security-cashier.headers.stsSeconds=31536000
      - traefik.http.middlewares.loal-security-cashier.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.loal-security-cashier.headers.contentTypeNosniff=true
      - traefik.http.middlewares.loal-security-cashier.headers.referrerPolicy=strict-origin-when-cross-origin

networks:
  web:
    name: ${TRAEFIK_NETWORK:-infra_default}
    external: true
