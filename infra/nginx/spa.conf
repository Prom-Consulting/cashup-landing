server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Кабинет не должен попадать в поиск. add_header не наследуется в блоки,
  # где есть свой add_header, поэтому повторяем его в каждом location ниже.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Хэш в имени файла — можно кэшировать надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html не кэшируем: иначе после деплоя браузер тянет старый бандл
  location = /index.html {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Роутинг внутри SPA: любой путь отдаёт index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
